name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify @capawesome/capacitor-file-picker is installed
        run: |
          if [ ! -d "node_modules/@capawesome/capacitor-file-picker" ]; then
            echo "❌ @capawesome/capacitor-file-picker missing"
            exit 1
          fi
          echo "✅ File picker plugin present"

      # ── Local FFmpeg plugin ─────────────────────────────────
      - name: Install local FFmpeg plugin
        run: |
          if [ ! -d "plugins/ffmpeg" ]; then
            echo "❌ plugins/ffmpeg directory missing"
            exit 1
          fi
          npm install ./plugins/ffmpeg --no-audit --no-fund
          if [ ! -d "node_modules/@dayront/capacitor-ffmpeg" ]; then
            echo "❌ Local FFmpeg plugin failed to install"
            exit 1
          fi
          echo "✅ Local FFmpeg plugin installed"

      - name: Build web assets
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          cmdline-tools-version: 11076708

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate Android project
        run: node ./node_modules/@capacitor/cli/bin/capacitor add android

      # ── CRITICAL: FFmpegKit requires minSdkVersion 24 ───────
      - name: Set minSdkVersion 24 for FFmpegKit
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's|minSdkVersion = .*|minSdkVersion = 24|' android/variables.gradle
            echo "── android/variables.gradle ──"
            cat android/variables.gradle
          else
            echo "⚠️ android/variables.gradle not found"
            exit 1
          fi

      - name: Install capacitor-assets
        run: npm install --no-save @capacitor/assets

      - name: Generate custom icons and splash
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Sync Capacitor
        run: node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Verify plugins are registered
        run: |
          PLUGINS_FILE="android/app/src/main/assets/capacitor.plugins.json"
          if [ ! -f "$PLUGINS_FILE" ]; then
            echo "⚠️ No capacitor.plugins.json"
            exit 0
          fi
          echo "── Registered Capacitor plugins ──"
          cat "$PLUGINS_FILE"
          echo ""
          if grep -q "FilePicker" "$PLUGINS_FILE"; then
            echo "✅ FilePicker registered"
          else
            echo "❌ FilePicker missing"
            exit 1
          fi
          if grep -q "FFmpeg" "$PLUGINS_FILE"; then
            echo "✅ FFmpeg registered"
          else
            echo "❌ FFmpeg missing"
            exit 1
          fi

      - name: Setup local.properties
        working-directory: android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dayront-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error