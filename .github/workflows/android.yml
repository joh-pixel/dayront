name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify @capawesome/capacitor-file-picker is installed
        run: |
          if [ ! -d "node_modules/@capawesome/capacitor-file-picker" ]; then
            echo "❌ @capawesome/capacitor-file-picker missing"
            exit 1
          fi
          echo "✅ File picker plugin present"

      - name: Install local FFmpeg plugin
        run: |
          if [ ! -d "plugins/ffmpeg" ]; then
            echo "❌ plugins/ffmpeg directory missing"
            exit 1
          fi
          npm install ./plugins/ffmpeg --no-audit --no-fund
          if [ ! -d "node_modules/@dayront/capacitor-ffmpeg" ]; then
            echo "❌ Local FFmpeg plugin failed to install"
            exit 1
          fi
          echo "✅ Local FFmpeg plugin installed"

      - name: Build web assets
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          cmdline-tools-version: 11076708

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate Android project
        run: node ./node_modules/@capacitor/cli/bin/capacitor add android

      # ── CRITICAL: FFmpegKit requires minSdkVersion 24 ───────
      - name: Force minSdkVersion 24 everywhere for FFmpegKit
        run: |
          echo "── Before ──"
          grep -rn "minSdk" android/variables.gradle android/app/build.gradle 2>/dev/null || true

          # 1. Capacitor's central config
          sed -i 's|minSdkVersion = .*|minSdkVersion = 24|' android/variables.gradle

          # 2. App-level build.gradle — force literal value
          sed -i 's|minSdkVersion rootProject.ext.minSdkVersion|minSdkVersion 24|' android/app/build.gradle
          sed -i 's|minSdkVersion .*|minSdkVersion 24|' android/app/build.gradle

          # 3. Manifest override — tell merger to ignore FFmpegKit's minSdk
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q 'xmlns:tools' "$MANIFEST"; then
              sed -i 's|<manifest |<manifest xmlns:tools="http://schemas.android.com/tools" |' "$MANIFEST"
            fi
            if ! grep -q 'overrideLibrary' "$MANIFEST"; then
              sed -i 's|<application |<application tools:overrideLibrary="com.arthenica.ffmpegkit" |' "$MANIFEST"
            fi
          fi

          echo ""
          echo "── After ──"
          grep -rn "minSdk" android/variables.gradle android/app/build.gradle 2>/dev/null || true
          echo ""
          echo "── Manifest (first 20 lines) ──"
          head -20 "$MANIFEST"

      - name: Install capacitor-assets
        run: npm install --no-save @capacitor/assets

      - name: Generate custom icons and splash
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Sync Capacitor
        run: node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Verify plugins are registered
        run: |
          PLUGINS_FILE="android/app/src/main/assets/capacitor.plugins.json"
          if [ ! -f "$PLUGINS_FILE" ]; then
            echo "⚠️ No capacitor.plugins.json"
            exit 0
          fi
          echo "── Registered Capacitor plugins ──"
          cat "$PLUGINS_FILE"
          echo ""
          if grep -q "FilePicker" "$PLUGINS_FILE"; then
            echo "✅ FilePicker registered"
          else
            echo "❌ FilePicker missing"
            exit 1
          fi
          if grep -q "FFmpeg" "$PLUGINS_FILE"; then
            echo "✅ FFmpeg registered"
          else
            echo "❌ FFmpeg missing"
            exit 1
          fi

      - name: Setup local.properties
        working-directory: android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ── Build APK — full log captured to file ──────────────
      - name: Build Debug APK
        id: build_apk
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-full.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "gradle_exit=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      # ── Extract the real error to the log bottom ───────────
      - name: Extract real Gradle error
        if: failure() || steps.build_apk.outputs.gradle_exit != '0'
        working-directory: android
        run: |
          echo ""
          echo "════════════════════════════════════════════"
          echo "  REAL GRADLE ERROR (What went wrong)"
          echo "════════════════════════════════════════════"
          grep -B 2 -A 20 "What went wrong" gradle-full.log || echo "(no 'What went wrong' found)"
          echo ""
          echo "════════════════════════════════════════════"
          echo "  ALL 'error:' LINES"
          echo "════════════════════════════════════════════"
          grep -i "error:" gradle-full.log | head -20 || echo "(no error: lines)"
          echo ""
          echo "════════════════════════════════════════════"
          echo "  'FAILED' TASK LINES"
          echo "════════════════════════════════════════════"
          grep -E "FAILED|failed" gradle-full.log | grep "Task" | head -10 || echo "(no failed tasks)"
          echo ""
          echo "════════════════════════════════════════════"
          echo "  LAST 30 LINES OF LOG"
          echo "════════════════════════════════════════════"
          tail -30 gradle-full.log

      # ── Upload log artifact for offline inspection ─────────
      - name: Upload Gradle failure log
        if: failure() || steps.build_apk.outputs.gradle_exit != '0'
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: android/gradle-full.log
          retention-days: 7
          if-no-files-found: warn

      - name: Upload APK artifact
        if: success() && steps.build_apk.outputs.gradle_exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: dayront-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error