name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify @capawesome/capacitor-file-picker is installed
        run: |
          if [ ! -d "node_modules/@capawesome/capacitor-file-picker" ]; then
            echo "❌ @capawesome/capacitor-file-picker missing"
            exit 1
          fi
          echo "✅ File picker plugin present"

      - name: Install local FFmpeg plugin
        run: |
          if [ ! -d "plugins/ffmpeg" ]; then
            echo "❌ plugins/ffmpeg directory missing"
            exit 1
          fi
          npm install ./plugins/ffmpeg --no-audit --no-fund
          if [ ! -d "node_modules/@dayront/capacitor-ffmpeg" ]; then
            echo "❌ Local FFmpeg plugin failed to install"
            exit 1
          fi
          echo "✅ Local FFmpeg plugin installed"

      - name: Build web assets
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          cmdline-tools-version: 11076708

      - name: Generate Android project
        run: node ./node_modules/@capacitor/cli/bin/capacitor add android

      # ── Force SDK versions + write override.gradle ────────────
      - name: Force SDK versions and native library overrides
        run: |
          echo "── Before ──"
          grep -rn "compileSdk\|minSdk\|targetSdk" android/variables.gradle 2>/dev/null || true

          # 1. Capacitor's central config
          sed -i 's|compileSdkVersion = .*|compileSdkVersion = 36|' android/variables.gradle
          sed -i 's|minSdkVersion = .*|minSdkVersion = 24|' android/variables.gradle
          sed -i 's|targetSdkVersion = .*|targetSdkVersion = 35|' android/variables.gradle

          # 2. Manifest override — must be on <uses-sdk>, not <application>
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q 'xmlns:tools' "$MANIFEST"; then
              sed -i 's|<manifest |<manifest xmlns:tools="http://schemas.android.com/tools" |' "$MANIFEST"
            fi
            sed -i 's| tools:overrideLibrary="[^"]*"||g' "$MANIFEST"
            if grep -q '<uses-sdk' "$MANIFEST"; then
              sed -i 's|<uses-sdk.*/>|<uses-sdk tools:overrideLibrary="com.arthenica.ffmpegkit" />|' "$MANIFEST"
            else
              sed -i 's|<application|<uses-sdk tools:overrideLibrary="com.arthenica.ffmpegkit" />\n    <application|' "$MANIFEST"
            fi
          fi

          # 3. Write an override.gradle that patches app/build.gradle
          cat > android/override.gradle << 'GRADLE'
          android {
              packagingOptions {
                  // Multiple deps bundle their own libc++_shared.so and FFmpeg .so files
                  // Pick the first one found instead of failing on the duplicate
                  pickFirst '**/libc++_shared.so'
                  pickFirst '**/libavcodec.so'
                  pickFirst '**/libavdevice.so'
                  pickFirst '**/libavfilter.so'
                  pickFirst '**/libavformat.so'
                  pickFirst '**/libavutil.so'
                  pickFirst '**/libpostproc.so'
                  pickFirst '**/libswresample.so'
                  pickFirst '**/libswscale.so'
                  pickFirst '**/libffmpegkit.so'
                  pickFirst '**/libffmpegkit_abidetect.so'
              }
              defaultConfig {
                  ndk {
                      // ffmpegkit-maintained publishes only these two ABIs
                      abiFilters 'arm64-v8a', 'x86_64'
                  }
              }
          }
          GRADLE

          # 4. Apply the override at the end of app/build.gradle
          if ! grep -q "apply from: '../override.gradle'" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "// Added by CI: native library overrides for FFmpegKit" >> android/app/build.gradle
            echo "apply from: '../override.gradle'" >> android/app/build.gradle
          fi

          echo ""
          echo "── After (variables.gradle) ──"
          grep -rn "compileSdk\|minSdk\|targetSdk" android/variables.gradle || true
          echo ""
          echo "── override.gradle ──"
          cat android/override.gradle
          echo ""
          echo "── app/build.gradle tail ──"
          tail -5 android/app/build.gradle

      - name: Install capacitor-assets
        run: npm install --no-save @capacitor/assets

      - name: Generate custom icons and splash
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Sync Capacitor
        run: node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Verify plugins are registered
        run: |
          PLUGINS_FILE="android/app/src/main/assets/capacitor.plugins.json"
          if [ ! -f "$PLUGINS_FILE" ]; then
            echo "⚠️ No capacitor.plugins.json"
            exit 0
          fi
          echo "── Registered Capacitor plugins ──"
          cat "$PLUGINS_FILE"
          echo ""
          if grep -q "FilePicker" "$PLUGINS_FILE"; then
            echo "✅ FilePicker registered"
          else
            echo "❌ FilePicker missing"
            exit 1
          fi
          if grep -q "FFmpeg" "$PLUGINS_FILE"; then
            echo "✅ FFmpeg registered"
          else
            echo "❌ FFmpeg missing"
            exit 1
          fi

      - name: Setup local.properties
        working-directory: android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ── Build APK — full log captured ──────────────────────
      - name: Build Debug APK
        id: build_apk
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace --refresh-dependencies 2>&1 | tee gradle-full.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "gradle_exit=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      # ── Extract the real error to the log bottom ───────────
      - name: Extract real Gradle error
        if: failure() || steps.build_apk.outputs.gradle_exit != '0'
        working-directory: android
        run: |
          echo ""
          echo "════════════════════════════════════════════"
          echo "  REAL GRADLE ERROR (What went wrong)"
          echo "════════════════════════════════════════════"
          grep -B 2 -A 30 "What went wrong" gradle-full.log || echo "(no 'What went wrong' found)"
          echo ""
          echo "════════════════════════════════════════════"
          echo "  FAILED TASKS"
          echo "════════════════════════════════════════════"
          grep -E "^> Task .* FAILED" gradle-full.log || echo "(no failed tasks found)"
          echo ""
          echo "════════════════════════════════════════════"
          echo "  ERRORS / EXCEPTIONS"
          echo "════════════════════════════════════════════"
          grep -iE "^e: |error:|Caused by:|Duplicate class|Cannot find|Could not resolve" gradle-full.log | head -30 || echo "(no error lines)"
          echo ""
          echo "════════════════════════════════════════════"
          echo "  LAST 60 LINES"
          echo "════════════════════════════════════════════"
          tail -60 gradle-full.log

      - name: Upload Gradle failure log
        if: failure() || steps.build_apk.outputs.gradle_exit != '0'
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: android/gradle-full.log
          retention-days: 7
          if-no-files-found: warn

      - name: Upload APK artifact
        if: success() && steps.build_apk.outputs.gradle_exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: dayront-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error